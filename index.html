<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pokémon Wilds</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="world"></canvas>

  <div id="hud" class="hidden">
    <div id="hud-loc"></div>
    <div id="hud-info"></div>
  </div>
  <canvas id="minimap" class="hidden" width="256" height="256"></canvas>
  <div id="toast" class="hidden"></div>

  <div id="battle" class="hidden">
    <div class="platform foe-plat"></div>
    <div class="platform my-plat"></div>
    <div class="spot foe-spot"><img id="foe-sprite" alt=""></div>
    <div class="spot my-spot"><img id="my-sprite" alt=""></div>
    <div id="ball" class="hidden"></div>
    <div id="foe-panel" class="panel">
      <div class="row"><span class="name"></span><span class="lvl"></span></div>
      <div class="types"></div>
      <div class="bar hp"><div class="fill"></div></div>
    </div>
    <div id="my-panel" class="panel">
      <div class="row"><span class="name"></span><span class="lvl"></span></div>
      <div class="types"></div>
      <div class="bar hp"><div class="fill"></div></div>
      <div class="hptext"></div>
      <div class="bar exp"><div class="fill"></div></div>
    </div>
  </div>
  <div id="flash" class="hidden"></div>

  <div id="title">
    <div class="logo-ball"></div>
    <h1>Pokémon <span>Wilds</span></h1>
    <p class="tag">An open-world Pokémon adventure</p>
    <div id="title-buttons"></div>
    <label class="seed">World seed (optional) <input id="seed" placeholder="random"></label>
    <p class="help">WASD move · Shift run · drag / Q E camera · Enter talk · Esc menu · M map</p>
  </div>

  <div id="textbox" class="hidden"></div>
  <div id="choices" class="hidden"></div>

  <div id="touch">
    <div class="dpad">
      <button data-dir="f">&#9650;</button>
      <button data-dir="l">&#9664;</button>
      <button data-dir="r">&#9654;</button>
      <button data-dir="b">&#9660;</button>
    </div>
    <div class="ab">
      <button data-btn="b">B</button>
      <button data-btn="a">A</button>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/data.js"></script>
  <script src="js/monster.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
